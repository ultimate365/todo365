<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo365</title>
    <style>
        :root {
            --primary: #7c3aed;
            --primary-dark: #6d28d9;
            --secondary: #10b981;
            --danger: #ef4444;
            --dark-bg: #0f172a;
            --dark-card: #1e293b;
            --dark-text: #f1f5f9;
            --dark-border: #334155;
            --light-text: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--dark-text);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        .app-title {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(124, 58, 237, 0.3);
        }

        .app-subtitle {
            color: var(--light-text);
            font-size: 1.1rem;
        }

        .todo-form {
            background-color: var(--dark-card);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--dark-border);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--light-text);
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            background-color: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--dark-border);
            border-radius: 8px;
            color: var(--dark-text);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        .datetime-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(124, 58, 237, 0.4);
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
        }

        .btn-secondary {
            background-color: var(--dark-border);
            color: var(--dark-text);
        }

        .btn-secondary:hover {
            background-color: #475569;
            transform: translateY(-2px);
        }

        .todo-list {
            background-color: var(--dark-card);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--dark-border);
        }

        .todo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .todo-count {
            color: var(--light-text);
            font-size: 0.9rem;
        }

        .filters {
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            padding: 8px 15px;
            background-color: transparent;
            border: 1px solid var(--dark-border);
            color: var(--light-text);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .filter-btn.active {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .todo-items {
            max-height: 500px;
            overflow-y: auto;
        }

        .todo-item {
            background-color: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--dark-border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            display: flex;
            align-items: flex-start;
        }

        .todo-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .todo-item.completed {
            opacity: 0.7;
            border-left: 4px solid var(--secondary);
        }

        .todo-item.completed .todo-topic {
            text-decoration: line-through;
            color: var(--light-text);
        }

        .todo-checkbox {
            margin-right: 15px;
            margin-top: 3px;
            transform: scale(1.2);
            accent-color: var(--secondary);
        }

        .todo-content {
            flex: 1;
        }

        .todo-topic {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark-text);
        }

        .todo-datetime {
            color: var(--light-text);
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .todo-description {
            color: var(--light-text);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .todo-actions {
            display: flex;
            gap: 10px;
            margin-left: 15px;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--light-text);
            cursor: pointer;
            padding: 5px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .action-btn.edit:hover {
            color: var(--primary);
            background-color: rgba(124, 58, 237, 0.1);
        }

        .action-btn.delete:hover {
            color: var(--danger);
            background-color: rgba(239, 68, 68, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--light-text);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--dark-border);
        }

        .empty-state h3 {
            margin-bottom: 10px;
            font-weight: 500;
        }

        /* Responsive styles */
        @media (max-width: 768px) {
            .app-title {
                font-size: 2.5rem;
            }
            
            .datetime-container {
                grid-template-columns: 1fr;
            }
            
            .todo-item {
                flex-direction: column;
            }
            
            .todo-actions {
                margin-left: 0;
                margin-top: 15px;
                justify-content: flex-end;
            }
            
            .filters {
                flex-wrap: wrap;
            }
        }

        @media (max-width: 480px) {
            .app-title {
                font-size: 2rem;
            }
            
            .todo-form, .todo-list {
                padding: 15px;
            }
            
            .btn {
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="app-title">Todo365</h1>
            <p class="app-subtitle">Your daily task manager</p>
        </header>
        
        <form class="todo-form" id="todoForm">
            <div class="form-group">
                <label for="topic">Topic</label>
                <input type="text" id="topic" placeholder="What do you need to do?" required>
            </div>
            
            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <textarea id="description" placeholder="Add more details about your task..."></textarea>
            </div>
            
            <div class="form-group">
                <label>Date & Time</label>
                <div class="datetime-container">
                    <input type="date" id="date" required>
                    <input type="time" id="time" required>
                </div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="submitBtn">Add Todo</button>
                <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">Cancel</button>
            </div>
        </form>
        
        <div class="todo-list">
            <div class="todo-header">
                <h2>Your Todos</h2>
                <div class="todo-count" id="todoCount">0 active, 0 completed</div>
            </div>
            
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            
            <div class="todo-items" id="todoItems">
                <!-- Todos will be rendered here -->
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const todoForm = document.getElementById('todoForm');
        const todoItems = document.getElementById('todoItems');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const todoCount = document.getElementById('todoCount');
        
        // State
        let todos = JSON.parse(localStorage.getItem('todos')) || [];
        let currentFilter = 'all';
        let editingTodoId = null;
        
        // Initialize the app
        function init() {
            renderTodos();
            setupEventListeners();
            setDefaultDateTime();
        }
        
        // Set up event listeners
        function setupEventListeners() {
            todoForm.addEventListener('submit', handleAddTodo);
            cancelBtn.addEventListener('click', cancelEdit);
            
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderTodos();
                });
            });
        }
        
        // Set default date and time
        function setDefaultDateTime() {
            const now = new Date();
            const today = now.toISOString().split('T')[0];
            const time = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            document.getElementById('date').value = today;
            document.getElementById('time').value = time;
        }
        
        // Reset form inputs
        function resetForm() {
            document.getElementById('topic').value = '';
            document.getElementById('description').value = '';
            setDefaultDateTime();
        }
        
        // Handle adding a new todo or updating an existing one
        function handleAddTodo(e) {
            e.preventDefault();
            
            const topic = document.getElementById('topic').value;
            const description = document.getElementById('description').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            
            if (!topic || !date || !time) {
                alert('Please fill in all required fields');
                return;
            }
            
            if (editingTodoId) {
                // Update existing todo
                todos = todos.map(todo => {
                    if (todo.id === editingTodoId) {
                        return {
                            ...todo,
                            topic,
                            description,
                            date,
                            time
                        };
                    }
                    return todo;
                });
                
                submitBtn.textContent = 'Add Todo';
                cancelBtn.style.display = 'none';
                editingTodoId = null;
            } else {
                // Add new todo
                const newTodo = {
                    id: Date.now().toString(),
                    topic,
                    description,
                    date,
                    time,
                    completed: false,
                    createdAt: new Date().toISOString()
                };
                
                todos.unshift(newTodo); // Add to beginning of array
            }
            
            saveTodos();
            renderTodos();
            
            // Reset form
            resetForm();
        }
        
        // Toggle todo completion status
        function toggleTodo(id) {
            todos = todos.map(todo => {
                if (todo.id === id) {
                    return { ...todo, completed: !todo.completed };
                }
                return todo;
            });
            
            saveTodos();
            renderTodos();
        }
        
        // Edit a todo
        function editTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (!todo) return;
            
            document.getElementById('topic').value = todo.topic;
            document.getElementById('description').value = todo.description || '';
            document.getElementById('date').value = todo.date;
            document.getElementById('time').value = todo.time;
            
            // Set editing state
            editingTodoId = id;
            submitBtn.textContent = 'Update Todo';
            cancelBtn.style.display = 'inline-block';
            
            // Scroll to form
            document.querySelector('.todo-form').scrollIntoView({ behavior: 'smooth' });
        }
        
        // Cancel editing
        function cancelEdit() {
            editingTodoId = null;
            submitBtn.textContent = 'Add Todo';
            cancelBtn.style.display = 'none';
            resetForm();
        }
        
        // Delete a todo
        function deleteTodo(id) {
            if (confirm('Are you sure you want to delete this todo?')) {
                todos = todos.filter(todo => todo.id !== id);
                saveTodos();
                renderTodos();
            }
        }
        
        // Save todos to localStorage
        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }
        
        // Format date for display
        function formatDate(dateString) {
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }
        
        // Format time for display
        function formatTime(timeString) {
            if (!timeString) return '';
            
            const [hours, minutes] = timeString.split(':');
            const hour = parseInt(hours);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const displayHour = hour % 12 || 12;
            
            return `${displayHour}:${minutes} ${ampm}`;
        }
        
        // Update todo count display
        function updateTodoCount() {
            const activeCount = todos.filter(todo => !todo.completed).length;
            const completedCount = todos.filter(todo => todo.completed).length;
            todoCount.textContent = `${activeCount} active, ${completedCount} completed`;
        }
        
        // Render todos based on current filter
        function renderTodos() {
            let filteredTodos = [...todos];
            
            // Apply filter
            if (currentFilter === 'active') {
                filteredTodos = filteredTodos.filter(todo => !todo.completed);
            } else if (currentFilter === 'completed') {
                filteredTodos = filteredTodos.filter(todo => todo.completed);
            }
            
            // Sort by creation date (newest first)
            filteredTodos.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            
            // Update UI
            if (filteredTodos.length === 0) {
                todoItems.innerHTML = `
                    <div class="empty-state">
                        <i>📝</i>
                        <h3>No todos found</h3>
                        <p>${currentFilter === 'all' ? 'Add your first todo to get started!' : 
                           currentFilter === 'active' ? 'All your todos are completed! Great job!' : 
                           'You haven\'t completed any todos yet.'}</p>
                    </div>
                `;
            } else {
                todoItems.innerHTML = filteredTodos.map(todo => `
                    <div class="todo-item ${todo.completed ? 'completed' : ''}">
                        <input 
                            type="checkbox" 
                            class="todo-checkbox" 
                            ${todo.completed ? 'checked' : ''}
                            onchange="toggleTodo('${todo.id}')"
                        >
                        <div class="todo-content">
                            <div class="todo-topic">${todo.topic}</div>
                            <div class="todo-datetime">
                                <span>📅 ${formatDate(todo.date)}</span>
                                <span>⏰ ${formatTime(todo.time)}</span>
                            </div>
                            ${todo.description ? `<div class="todo-description">${todo.description}</div>` : ''}
                        </div>
                        <div class="todo-actions">
                            <button class="action-btn edit" onclick="editTodo('${todo.id}')">
                                ✏️
                            </button>
                            <button class="action-btn delete" onclick="deleteTodo('${todo.id}')">
                                🗑️
                            </button>
                        </div>
                    </div>
                `).join('');
            }
            
            // Update todo count
            updateTodoCount();
        }
        
        // Initialize the app when the page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
  </html>
